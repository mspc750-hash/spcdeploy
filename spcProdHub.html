<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 1. meta refresh 태그: 0초 후 mhub.co.kr로 이동 -->
    <meta http-equiv="refresh" content="0; url=https://mhub.spc.co.kr">
    <title>Redirecting...</title>
    <!-- 2. JS fallback: meta 태그가 작동하지 않을 경우 대비 -->
    <script>
        window.location.href = "https://mhub.spc.co.kr";
    </script>
</head>
<body>
    <p>페이지가 이동 중입니다. 자동으로 이동하지 않으면 <a href="https://mhub.spc.co.kr">여기</a>를 클릭하세요.</p>
</body>
</html>
